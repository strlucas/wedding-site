<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruna & Lucas — Save The Date</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --marsala: #771119;
            --verde-escuro: #2a3c35;
            --bege-fundo: #f5efe2;
            --texto-escuro: #332a26;
            
            --fonte-titulo: 'Cinzel', serif;
            --fonte-cursiva: 'Cormorant Garamond', serif;
            --fonte-sans: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fundo geral da página alterado para o tom bege #f5efe2 */
        body {
            background-color: var(--bege-fundo);
            color: var(--texto-escuro);
            font-family: var(--fonte-sans);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* Container Principal do Site */
        .page-wrapper {
            width: 100%;
            max-width: 750px;
            background-color: var(--bege-fundo);
            box-shadow: 0 15px 50px rgba(119, 17, 25, 0.12);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(119, 17, 25, 0.1);
        }

        /* =================================================
           1. FOTO PRINCIPAL INICIAL (HERO)
           ================================================= */
        .hero-section {
            width: 100%;
            line-height: 0;
            border-bottom: 4px solid var(--marsala);
        }

        .hero-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* =================================================
           2. CONVITE CLÁSSICO COM MOLDURA E FLOR.PNG
           ================================================= */
        .card-container {
            margin: 35px 20px;
            background-color: var(--bege-fundo);
            border: 12px solid var(--marsala);
            padding: 35px 25px;
            text-align: center;
            position: relative;
        }

        .header-date-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .date-text {
            font-family: var(--fonte-sans);
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--marsala);
            font-weight: 500;
            text-transform: uppercase;
        }

        /* IMAGEM DA FLOR */
        .botanical-image {
            width: 70px;
            height: auto;
            display: block;
            filter: invert(13%) sepia(85%) saturate(3674%) hue-rotate(338deg) brightness(88%) contrast(98%);
        }

        .main-title {
            font-family: var(--fonte-titulo);
            color: var(--marsala);
            font-size: 3.2rem;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .main-title span {
            display: block;
        }

        .divider-line {
            width: 100%;
            height: 1.5px;
            background-color: var(--marsala);
            margin: 0 auto;
        }

        .invitation-text {
            font-family: var(--fonte-cursiva);
            font-style: italic;
            font-size: 1.35rem;
            color: var(--marsala);
            padding: 16px 10px;
            line-height: 1.4;
            font-weight: 400;
        }

        .button-section {
            margin-top: 25px;
        }

        .btn-save-the-date {
            display: inline-block;
            background-color: var(--verde-escuro);
            color: var(--bege-fundo);
            font-family: var(--fonte-sans);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 12px 32px;
            border: none;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-save-the-date:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* =================================================
           3. DETALHES DO EVENTO & CONTAGEM REGRESSIVA
           ================================================= */
        .section-details {
            padding: 10px 30px 35px 30px;
            text-align: center;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 30px 0;
        }

        .countdown-box {
            background-color: var(--marsala);
            color: var(--bege-fundo);
            padding: 12px 8px;
            border-radius: 6px;
            min-width: 65px;
        }

        .countdown-box .number {
            font-family: var(--fonte-titulo);
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1;
        }

        .countdown-box .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            opacity: 0.85;
        }

        /* =================================================
           NOVA SEÇÃO DE IMAGEM APÓS A CONTAGEM
           ================================================= */
        .photo-gallery-section {
            width: 100%;
            margin: 20px 0 35px 0;
            line-height: 0;
            border-top: 2px solid rgba(119, 17, 25, 0.15);
            border-bottom: 2px solid rgba(119, 17, 25, 0.15);
        }

        .photo-gallery-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        .event-info-box {
            background-color: rgba(119, 17, 25, 0.04);
            border: 1px solid rgba(119, 17, 25, 0.15);
            border-radius: 8px;
            padding: 25px 20px;
            margin-bottom: 30px;
        }

        .info-group {
            margin-bottom: 18px;
        }

        .info-group:last-child {
            margin-bottom: 0;
        }

        .info-group i {
            color: var(--marsala);
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .info-group .title-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--verde-escuro);
            font-weight: 600;
        }

        .info-group .value-text {
            font-family: var(--fonte-cursiva);
            font-size: 1.4rem;
            color: var(--marsala);
            font-weight: 600;
        }

        .info-group .address-text {
            font-size: 0.95rem;
            color: var(--texto-escuro);
            margin-top: 2px;
        }

        /* =================================================
           4. OS 3 BOTÕES DE AÇÃO
           ================================================= */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-whatsapp {
            background-color: var(--marsala);
            color: var(--bege-fundo);
            border: 1px solid var(--marsala);
        }

        .btn-whatsapp:hover {
            background-color: #5b0d13;
        }

        .btn-gifts {
            background-color: transparent;
            color: var(--marsala);
            border: 1.5px solid var(--marsala);
        }

        .btn-gifts:hover {
            background-color: var(--marsala);
            color: var(--bege-fundo);
        }

        .btn-maps {
            background-color: var(--verde-escuro);
            color: var(--bege-fundo);
            border: 1px solid var(--verde-escuro);
        }

        .btn-maps:hover {
            background-color: #1c2823;
        }

        footer {
            margin-top: 35px;
            padding: 20px;
            background-color: var(--marsala);
            color: var(--bege-fundo);
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        @media (max-width: 550px) {
            .card-container {
                border-width: 8px;
                padding: 25px 15px;
                margin: 25px 12px;
            }

            .main-title {
                font-size: 2.2rem;
                letter-spacing: 1px;
            }

            .invitation-text {
                font-size: 1.15rem;
            }

            .header-date-section {
                gap: 10px;
            }

            .date-text {
                font-size: 0.75rem;
                letter-spacing: 2px;
            }

            .botanical-image {
                width: 55px;
            }

            .countdown-box {
                min-width: 55px;
                padding: 10px 6px;
            }

            .countdown-box .number {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        
        <!-- 1. FOTO PRINCIPAL INICIAL DO CASAL -->
        <div class="hero-section">
            <img src="Black White Photo Collage Minimalist Elegant Save The Date Card(2).png" alt="Bruna e Lucas">
        </div>

        <!-- 2. REPRODUÇÃO DO CONVITE RETANGULAR COM A FLOR.PNG -->
        <div class="card-container">
            
            <div class="header-date-section">
                <span class="date-text">ABR 17</span>
                
                <!-- Imagem flor.png -->
                <img src="flor.png" alt="Flor" class="botanical-image" onerror="this.style.display='none'">

                <span class="date-text">2027</span>
            </div>

            <h1 class="main-title">
                <span>Bruna</span>
                <span>& Lucas</span>
            </h1>

            <div class="divider-line"></div>

            <p class="invitation-text">
                Convidamos você para compartilhar<br>
                esse momento de nossas vidas
            </p>

            <div class="divider-line"></div>


        </div>

        <!-- 3. DETALHES DO EVENTO & CONTAGEM REGRESSIVA -->
        <div class="section-details" id="detalhes">
            
            <div class="countdown-container" id="countdown">
                <div class="countdown-box">
                    <div class="number" id="dias">00</div>
                    <div class="label">Dias</div>
                </div>
                <div class="countdown-box">
                    <div class="number" id="horas">00</div>
                    <div class="label">Horas</div>
                </div>
                <div class="countdown-box">
                    <div class="number" id="minutos">00</div>
                    <div class="label">Min</div>
                </div>
                <div class="countdown-box">
                    <div class="number" id="segundos">00</div>
                    <div class="label">Seg</div>
                </div>
            </div>

            <!-- NOVA SEÇÃO PARA A SEGUNDA IMAGEM -->
            <div class="photo-gallery-section">
                <!-- Substitua 'sua-segunda-foto.png' pelo nome da sua segunda imagem -->
                <img src="manual-convidade.png" alt="Foto do Casal">
            </div>

            <div class="event-info-box">
                <div class="info-group">
                    <i class="fa-regular fa-clock"></i>
                    <div class="title-label">Horário</div>
                    <div class="value-text">15:00 hrs</div>
                </div>

                <div class="divider-line" style="width: 40px; margin: 15px auto; opacity: 0.3;"></div>

                <div class="info-group">
                    <i class="fa-solid fa-location-dot"></i>
                    <div class="title-label">Localização</div>
                    <div class="address-text">
                        Rua Major José Lopes, 11<br>
                        <strong>Jardim Shangrilá</strong>
                    </div>
                </div>
            </div>

            <!-- 4. BOTÕES DE AÇÃO -->
            <div class="action-buttons">
                <!-- Botão 1: Confirmar Presença via WhatsApp -->
                <a href="https://wa.me/5500000000000?text=Olá!%20Gostaria%20de%20confirmar%20minha%20presença%20no%20casamento%20de%20Bruna%20e%20Lucas." target="_blank" class="btn-action btn-whatsapp">
                    <i class="fa-solid fa-list-check"></i>
                    Confirmar Presença (RSVP)
                </a>

                <!-- Botão 2: Lista de Presentes -->
                <a href="#" target="_blank" class="btn-action btn-gifts">
                    <i class="fa-solid fa-gift"></i>
                    Lista de Presentes
                </a>

                <!-- Botão 3: Endereço no Google Maps -->
                <a href="https://maps.google.com/?q=Rua+Major+José+Lopes,+11+-+Jardim+Shangrilá" target="_blank" class="btn-action btn-maps">
                    <i class="fa-solid fa-map-location-dot"></i>
                    Como Chegar (Google Maps)
                </a>
            </div>

        </div>

        <footer>
            BRUNA & LUCAS • 17.04.2026
        </footer>

    </div>

    <!-- Script para atualizar a Contagem Regressiva -->
    <script>
        const targetDate = new Date("April 17, 2027 15:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("dias").innerText = days < 10 ? '0' + days : days;
                document.getElementById("horas").innerText = hours < 10 ? '0' + hours : hours;
                document.getElementById("minutos").innerText = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById("segundos").innerText = seconds < 10 ? '0' + seconds : seconds;
            } else {
                document.getElementById("countdown").innerHTML = "<p style='color: var(--marsala); font-weight: 600;'>É Hoje!</p>";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
